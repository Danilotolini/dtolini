spring:
  application:
    name: ds-tolini

  datasource:
    url: jdbc:postgresql://localhost:5432/dstolini
    username: dstolini
    password: dstolini
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gerencia o schema; Hibernate só valida
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080
  error:
    include-message: never      # Não vazar stack trace em produção

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

treasury:
  api:
    base-url: https://api.fiscaldata.treasury.gov
  ingest:
    cron: "0 30 21 * * MON-FRI"   # 18h30 BRT (UTC-3)

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs

logging:
  level:
    com.dstolini: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
